<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px 16px 16px; font: 13px/1.5 system-ui, sans-serif; color: #111827; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  select, input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 4px; }
  .row { margin: 6px 0; }
  button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #111827; color: #fff; font-size: 13px; cursor: pointer; }
  button:hover { background: #1f2937; }
  #status { margin-top: 8px; font-size: 12px; color: #047857; min-height: 16px; }
  a { color: #2563eb; }
</style>
</head>
<body>
  <h1>TabNews Paste Image</h1>

  <label for="provider">Servidor de imagens</label>
  <select id="provider">
    <option value="auto">Automático (tenta vários)</option>
    <option value="catbox">catbox.moe (permanente)</option>
    <option value="pomf">pomf.lain.la (permanente)</option>
    <option value="uguu">uguu.se (temporário)</option>
    <option value="litterbox">litterbox (temporário, até 72h)</option>
    <option value="tmpfiles">tmpfiles.org (temporário)</option>
    <option value="imgur">Imgur (requer Client-ID)</option>
  </select>
  <div class="hint">No modo automático: catbox → pomf → uguu → litterbox → tmpfiles. Se o catbox estiver pausado, cai para o próximo.</div>

  <label>Formato inserido no comentário</label>
  <div class="row"><label style="font-weight:normal"><input type="radio" name="format" value="html" checked> HTML: <code>&lt;img src="..."&gt;</code></label></div>
  <div class="row"><label style="font-weight:normal"><input type="radio" name="format" value="markdown"> Markdown: <code>![](...)</code></label></div>

  <label for="imgurClientId">Imgur Client-ID (opcional)</label>
  <input type="text" id="imgurClientId" placeholder="ex.: 1a2b3c4d5e6f789" autocomplete="off" spellcheck="false">
  <div class="hint">Grátis em <a href="https://api.imgur.com/oauth2/addclient" target="_blank" rel="noreferrer">api.imgur.com/oauth2/addclient</a> (escolha "Anonymous usage"). Com ele preenchido, o Imgur entra primeiro no modo automático e é permanente.</div>

  <button id="save">Salvar</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
